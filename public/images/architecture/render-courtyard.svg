<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">Courtyard House sample render</title>
  <desc id="d">Original stylised sample render of the courtyard in afternoon light. Replace with Dia's own render.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#F6C98E"/><stop offset=".55" stop-color="#F8E3C4"/><stop offset="1" stop-color="#FBF1DF"/></linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE7B0" stop-opacity=".85"/><stop offset="1" stop-color="#FFE7B0" stop-opacity="0"/></linearGradient>
    <radialGradient id="leaf" cx=".4" cy=".35"><stop stop-color="#9DB880"/><stop offset="1" stop-color="#4F7448"/></radialGradient>
    <linearGradient id="glow" x2="0" y2="1"><stop stop-color="#FFC77A"/><stop offset="1" stop-color="#E6954B"/></linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <circle cx="1010" cy="120" r="64" fill="#FFF3D2"/><circle cx="1010" cy="120" r="120" fill="#FFE6B0" opacity=".35"/>
  <!-- ground -->
  <path d="M0 560H1200V750H0Z" fill="#CBB79A"/><path d="M0 560H1200" stroke="#9C8767" stroke-width="3"/>
  <!-- wings -->
  <rect x="150" y="312" width="322" height="248" fill="#E7D3B4"/><rect x="728" y="312" width="322" height="248" fill="#DDC6A2"/>
  <rect x="140" y="296" width="342" height="22" fill="#B58C63"/><rect x="718" y="296" width="342" height="22" fill="#B58C63"/>
  <!-- courtyard interior walls -->
  <rect x="472" y="318" width="256" height="242" fill="#F2E3C9"/>
  <rect x="472" y="318" width="40" height="242" fill="#D9C3A0"/><rect x="688" y="318" width="40" height="242" fill="#EDD7B3"/>
  <!-- light shaft + floor patch -->
  <path d="M780 140 470 560H740Z" fill="url(#shaft)"/><path d="M500 560l120-40 110 40z" fill="#FFE3A6" opacity=".8"/>
  <!-- tree -->
  <path d="M600 560V420" stroke="#5B4632" stroke-width="12" stroke-linecap="round"/>
  <circle cx="600" cy="385" r="78" fill="url(#leaf)"/><circle cx="552" cy="420" r="46" fill="url(#leaf)"/><circle cx="650" cy="415" r="50" fill="url(#leaf)"/>
  <ellipse cx="640" cy="566" rx="86" ry="12" fill="#6b5a3f" opacity=".35"/>
  <!-- glowing openings -->
  <rect x="180" y="400" width="100" height="120" fill="url(#glow)"/><rect x="330" y="400" width="100" height="120" fill="url(#glow)"/><rect x="780" y="400" width="100" height="120" fill="url(#glow)"/><rect x="930" y="400" width="100" height="120" fill="url(#glow)"/>
  <g stroke="#6B4B2C" stroke-width="5" fill="none"><rect x="180" y="400" width="100" height="120"/><rect x="330" y="400" width="100" height="120"/><rect x="780" y="400" width="100" height="120"/><rect x="930" y="400" width="100" height="120"/><path d="M230 400V520M380 400V520M830 400V520M980 400V520"/></g>
  <!-- shadows -->
  <path d="M472 560H150l-60 14h400z" fill="#6b5a3f" opacity=".25"/>
  <text x="60" y="720" font-family="Arial,sans-serif" font-size="16" letter-spacing="2" fill="#6b4b2c">SAMPLE RENDER — NOT A BUILT PROJECT</text>
</svg>
