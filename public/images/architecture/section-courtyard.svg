<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d">
  <title id="t">Courtyard House sample section</title>
  <desc id="d">Original sample section drawing through the courtyard. Replace with Dia's own section.</desc>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#59685D" stroke-opacity=".12"/></pattern>
    <pattern id="p" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#23211F"/><path d="M0 0V8" stroke="#6b665c" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="750" fill="#F2EFE8"/><rect width="1200" height="750" fill="url(#g)"/>
  <!-- ground -->
  <path d="M0 560H1200" stroke="#23211F" stroke-width="5"/><path d="M0 575H1200V750H0Z" fill="#E4DFD3"/>
  <!-- cut walls and slabs (poché) -->
  <g fill="url(#p)"><rect x="150" y="330" width="22" height="245"/><rect x="450" y="330" width="22" height="245"/><rect x="728" y="330" width="22" height="245"/><rect x="1028" y="330" width="22" height="245"/>
  <rect x="140" y="312" width="342" height="22"/><rect x="718" y="312" width="342" height="22"/><rect x="150" y="548" width="300" height="14"/><rect x="750" y="548" width="278" height="14"/></g>
  <!-- courtyard void -->
  <rect x="472" y="330" width="256" height="230" fill="#E9F0E1" fill-opacity=".6"/>
  <path d="M600 560V420" stroke="#23211F" stroke-width="6"/><circle cx="600" cy="385" r="68" fill="none" stroke="#23211F" stroke-width="3"/><path d="M560 385h80M600 345v80M572 357l56 56M628 357l-56 56" stroke="#23211F" stroke-width="1.5"/>
  <!-- openings onto courtyard -->
  <g fill="#F2EFE8" stroke="#23211F" stroke-width="3"><rect x="450" y="420" width="22" height="110"/><rect x="728" y="420" width="22" height="110"/></g>
  <!-- light rays -->
  <path d="M1000 120 590 560M1060 130 650 560M940 110 540 560" stroke="#B1763F" stroke-width="2" stroke-dasharray="10 10" opacity=".7"/>
  <!-- dimensions -->
  <g stroke="#59685D" stroke-width="2" fill="none"><path d="M110 330V560M100 330h20M100 560h20"/><path d="M472 640H728M472 630v20M728 630v20"/></g>
  <g font-family="Arial,sans-serif" fill="#23211F" font-size="15" letter-spacing="2"><text x="504" y="670">COURTYARD 5.1 M</text><text x="60" y="305">+3.40</text><text x="60" y="590">±0.00</text><text x="100" y="720" font-size="16">SAMPLE SECTION A–A — NOT A BUILT PROJECT</text></g>
</svg>
